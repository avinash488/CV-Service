version: "3.9"

networks:
  ai-network:
    driver: bridge

services:
  cv-service:
    build: .
    container_name: cv-service
    ports:
      - "8001:8001"
    environment:
      - P1_PREDICT_URL=http://mlops-service:8000/predict
    networks:
      - ai-network
    depends_on:
      - mlops-service

  mlops-service:
    image: mlops-service:latest
    container_name: mlops-service
    ports:
      - "8000:8000"
    networks:
      - ai-network